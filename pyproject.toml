[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ming-zhengshuo"
version = "0.2.0"
description = "Bidirectional East Asian era-name interchange for historical research"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "MingZhengshuo Contributors" }
]

[project.scripts]
ming-zhengshuo = "ming_zhengshuo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ming_zhengshuo = ["data/*.json"]
